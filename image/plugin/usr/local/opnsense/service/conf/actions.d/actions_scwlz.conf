[sync]
command:/usr/local/opnsense/scripts/scwlz/sync.sh cron
parameters:
type:script
message:scwlz: pull the node configuration from the instance metadata
description:Scaleway LZ: pull the configuration from the instance metadata

[vip]
command:/usr/local/opnsense/scripts/scwlz/vip.sh reconcile
parameters:
type:script
message:scwlz: reconcile the data VIPs with the CARP state
description:Scaleway LZ: move the data VIPs to the CARP master
